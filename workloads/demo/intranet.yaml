# ============================================================================
# intranet — demo app that attaches to the INTERNAL gateway only.
#
# The two-curl proof this enables:
#   internet → http://intranet.satheshkumarnapoleon.site/  → 404
#     (wildcard DNS resolves to the LB → PUBLIC Envoy → which has no route
#      for this host; the internal gateway is simply not reachable from
#      outside)
#   kubectl port-forward svc/istio-internal-gateway 8081:80 →
#   curl -H "Host: intranet.satheshkumarnapoleon.site" localhost:8081 → 200
#
#   kubectl apply -f workloads/demo/intranet.yaml
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intranet
  namespace: demo
  labels:
    app: intranet
spec:
  # replicas: deliberately absent — the HPA at the end of this file owns it
  selector:
    matchLabels:
      app: intranet
  template:
    metadata:
      labels:
        app: intranet
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:37   # already cached on the nodes
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: intranet
  namespace: demo
spec:
  selector:
    app: intranet
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: intranet
  namespace: demo
spec:
  parentRefs:
    - name: internal-gateway      # ← the second Gateway, NOT lab-gateway
      namespace: istio-system
  hostnames:
    - intranet.satheshkumarnapoleon.site
  rules:
    - backendRefs:
        - name: intranet
          port: 80
---
# The Deployment above has NO spec.replicas on purpose: this HPA owns the
# count. With `replicas:` in git every scale-out is /spec/replicas drift that
# Argo selfHeal reverts within seconds (K8s + Argo CD docs: HPA-managed →
# drop replicas). The owning Application (demo-extras) also ignores
# /spec/replicas. minReplicas == the value removed (1) → no scale-down on merge.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: intranet
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: intranet
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
