# ============================================================================
# Grafana dashboard ConfigMap — Per-Service SLO ($service template var).
#
# Sidecar-provisioned (grafana.sidecar.dashboards, kps-values.yaml): any
# ConfigMap labeled grafana_dashboard=1 in any namespace is auto-loaded by
# Grafana, no restart, no helm upgrade. Same pattern as
# loki-grafana-datasource.yaml (grafana_datasource=1 sidecar).
#
# Data source: Istio's own generated telemetry — istio_requests_total /
# istio_request_duration_milliseconds_bucket, scraped via the envoy-stats
# PodMonitor (istio-telemetry.yaml). Confirmed LIVE against this cluster's
# Prometheus (not assumed from generic Istio docs):
#   - metric names above are exact (istio 1.30.2 build seen on istiod/proxies)
#   - service identity label = destination_service_name (short svc name)
#   - MUST filter reporter="destination" — both sidecars on a call report
#     istio_requests_total; without this filter every count is ~2x
#   - histogram bucket le="500.0" sits EXACTLY on the 500ms SLO threshold
#     (unit is milliseconds) — no bucket-boundary approximation needed
#
# SLA vs SLO (deliberately different, see in-dashboard text panel):
#   Business SLA (customer-facing):  99%    of requests < 500ms
#   Internal latency SLO (alerted):  99.95% of requests < 500ms  (safety
#                                    margin above the SLA)
#   Availability SLO:                99.95% non-5xx
#
# Known lab caveats (also called out in the dashboard's own text panel):
#   - httpbin & intranet are meshed + selectable in $service but currently
#     have ZERO istio_requests_total series (never received traffic) — their
#     traffic panels read "No data" until something calls them. $service is
#     a static list (not label_values-derived) specifically so they still
#     show up as selectable instead of silently disappearing.
#   - Prometheus retention here is 5d (kps-values.yaml STORAGE NOTE). The
#     $budget_window default (30d) will under-report vs a real 30d compliance
#     window until retention grows or a Thanos/remote-write path exists.
#
#   kubectl apply -f platform/observability/slo-dashboard-per-service.yaml
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-dashboard-per-service
  namespace: monitoring
  labels:
    grafana_dashboard: "1"     # ← the sidecar's trigger label
data:
  slo-per-service.json: |
    {
