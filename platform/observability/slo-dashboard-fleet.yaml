# ============================================================================
# Grafana dashboard ConfigMap — Fleet-Wide SLO rollup (all meshed services in
# the demo namespace: echo, echo-v2, hello-api, httpbin, intranet, podinfo).
#
# Sidecar-provisioned, same convention as slo-dashboard-per-service.yaml —
# see that file's header for the full metric/label verification notes
# (istio_requests_total / istio_request_duration_milliseconds_bucket,
# reporter="destination" required, le="500.0" bucket == 500ms exactly).
#
# Adds a per-service breakdown table (SLI + error-budget-remaining side by
# side) so the fleet rollup and the per-service drill-down aren't the only
# way to compare services against each other.
#
# Same lab caveats apply: httpbin/intranet rows are absent from the
# breakdown table until they receive traffic (Prometheus has no series for
# them yet); 5d retention caps how far back $budget_window can honestly see.
#
#   kubectl apply -f platform/observability/slo-dashboard-fleet.yaml
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: slo-dashboard-fleet
  namespace: monitoring
  labels:
    grafana_dashboard: "1"     # ← the sidecar's trigger label
data:
  slo-fleet-overview.json: |
    {
      "id": null,
      "uid": "slo-fleet-overview",
      "title": "SLO \u2014 Fleet Overview (all services)",
      "tags": [
        "slo",
        "istio",
        "sre"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "refresh": 1,
            "regex": "",
            "label": "Prometheus",
            "current": {}
          },
          {
            "name": "sli_window",
            "type": "custom",
            "label": "SLI rolling window",
            "query": "5m,30m,1h,6h,24h",
            "options": [
              {
                "text": "5m",
                "value": "5m",
                "selected": false
              },
              {
                "text": "30m",
                "value": "30m",
                "selected": true
              },
              {
                "text": "1h",
                "value": "1h",
                "selected": false
              },
              {
                "text": "6h",
                "value": "6h",
                "selected": false
              },
              {
                "text": "24h",
                "value": "24h",
                "selected": false
              }
            ],
            "current": {
              "text": "30m",
              "value": "30m"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false
          },
          {
            "name": "budget_window",
            "type": "custom",
            "label": "Error-budget compliance window",
            "query": "1d,3d,7d,30d",
            "options": [
              {
                "text": "1d",
                "value": "1d",
                "selected": false
              },
              {
                "text": "3d",
                "value": "3d",
                "selected": false
              },
              {
                "text": "7d",
                "value": "7d",
                "selected": false
              },
              {
                "text": "30d",
                "value": "30d",
                "selected": true
              }
            ],
            "current": {
              "text": "30d",
              "value": "30d"
            },
            "hide": 0,
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Read me first \u2014 SLA/SLO definitions & data caveats",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 6
          },
          "options": {
            "mode": "markdown",
            "content": "### SLA vs SLO\n- **Business SLA (customer-facing):** 99% of requests complete within 500ms.\n- **Internal latency SLO (tracked/alerted here):** 99.95% within 500ms \u2014 a stricter internal safety margin above the SLA so we get paged before the SLA itself is at risk.\n- **Availability SLO:** 99.95% non-5xx responses.\n\n### Data caveats (read before trusting the numbers)\n- Source: `istio_requests_total` / `istio_request_duration_milliseconds_bucket`, filtered to `reporter=\"destination\"` (avoids double-counting \u2014 both the client and server Envoy sidecars report every call).\n- The `le=\"500.0\"` histogram bucket sits **exactly** at the 500ms SLO threshold (confirmed live against Prometheus) \u2014 the latency SLI below is computed directly from it, no approximation.\n- `httpbin` and `intranet` are meshed and selectable but have **zero live traffic** right now, so their traffic-derived panels will show \"No data\" until something calls them.\n- Prometheus retention in this lab is **5 days** (`kps-values.yaml`). A 30d error-budget/compliance window will silently under-report until retention is extended or a Thanos/remote-write path exists \u2014 drop `$budget_window` to 3d/7d for a number retention can actually back."
          }
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Availability SLI vs 99.95% SLO (Fleet-Wide)",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"demo\", reporter=\"destination\", response_code!~\"5..\"}[$sli_window]))\n/\nsum(rate(istio_requests_total{destination_workload_namespace=\"demo\", reporter=\"destination\"}[$sli_window]))",
              "refId": "A",
              "format": "time_series"
            }
          ],
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.995
                  },
                  {
                    "color": "green",
                    "value": 0.9995
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "gauge",
          "title": "Latency SLI (<500ms) \u2014 SLA 99% / SLO 99.95% (Fleet-Wide)",
          "gridPos": {
            "x": 8,
            "y": 6,
            "w": 8,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(istio_request_duration_milliseconds_bucket{le=\"500.0\", destination_workload_namespace=\"demo\", reporter=\"destination\"}[$sli_window]))\n/\nsum(rate(istio_request_duration_milliseconds_count{destination_workload_namespace=\"demo\", reporter=\"destination\"}[$sli_window]))",
              "refId": "A",
              "format": "time_series"
            }
          ],
          "options": {
            "showThresholdLabels": false,
            "showThresholdMarkers": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.9995
                  }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Request Rate (RPS)",
          "gridPos": {
            "x": 16,
            "y": 6,
            "w": 4,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"demo\", reporter=\"destination\"}[$sli_window]))",
              "refId": "A",
              "format": "time_series"
