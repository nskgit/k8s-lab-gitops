# ============================================================================
# echo-v2 — canary backend for the weighted-split demo (Phase 6 expansion S3).
#
# Design point: v2 gets its OWN labels + Service. If v2 pods carried
# app: echo, the existing v1 Service would match them immediately and
# versions would blend at the Service layer (kube-proxy round-robin, no
# weight control). One Service per version gives the HTTPRoute two
# distinct targets to weight — the split happens in the gateway Envoy
# (weighted clusters), per-request, exact percentages.
#
# The weights live in the HTTPRoute (workloads/demo/echo.yaml). This is the
# manual version of what Argo Rollouts / Flagger automate: step the
# weight 10→25→50→100 while watching Prometheus SLOs, rollback on breach.
#
#   kubectl apply -f workloads/demo/echo-v2-canary.yaml
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-v2
  namespace: demo
  labels:
    app: echo-v2
spec:
  # replicas: deliberately absent — the HPA at the end of this file owns it
  selector:
    matchLabels:
      app: echo-v2
  template:
    metadata:
      labels:
        app: echo-v2
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:37
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_PORT
              value: "8080"
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: echo-v2
  namespace: demo
spec:
  selector:
    app: echo-v2
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
# The Deployment above has NO spec.replicas on purpose: this HPA owns the
# count. With `replicas:` in git every scale-out is /spec/replicas drift that
# Argo selfHeal reverts within seconds (K8s + Argo CD docs: HPA-managed →
# drop replicas). The owning Application (demo-extras) also ignores
# /spec/replicas. minReplicas == the value removed (1) → no scale-down on merge.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: echo-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: echo-v2
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
