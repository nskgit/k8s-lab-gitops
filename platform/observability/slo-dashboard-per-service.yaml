        {
          "id": 1,
          "type": "text",
          "title": "Read me first \u2014 SLA/SLO definitions & data caveats",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 6
          },
          "options": {
            "mode": "markdown",
            "content": "### SLA vs SLO\n- **Business SLA (customer-facing):** 99% of requests complete within 500ms.\n- **Internal latency SLO (tracked/alerted here):** 99.95% within 500ms \u2014 a stricter internal safety margin above the SLA so we get paged before the SLA itself is at risk.\n- **Availability SLO:** 99.95% non-5xx responses.\n\n### Data caveats (read before trusting the numbers)\n- Source: `istio_requests_total` / `istio_request_duration_milliseconds_bucket`, filtered to `reporter=\"destination\"` (avoids double-counting \u2014 both the client and server Envoy sidecars report every call).\n- The `le=\"500.0\"` histogram bucket sits **exactly** at the 500ms SLO threshold (confirmed live against Prometheus) \u2014 the latency SLI below is computed directly from it, no approximation.\n- `httpbin` and `intranet` are meshed and selectable but have **zero live traffic** right now, so their traffic-derived panels will show \"No data\" until something calls them.\n- Prometheus retention in this lab is **5 days** (`kps-values.yaml`). A 30d error-budget/compliance window will silently under-report until retention is extended or a Thanos/remote-write path exists \u2014 drop `$budget_window` to 3d/7d for a number retention can actually back."
          }
