                }
              }
            },
            "overrides": []
          }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Error Budget Remaining \u2014 Availability",
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "1 - ((1 - (\nsum(rate(istio_requests_total{destination_workload_namespace=\"demo\", reporter=\"destination\", response_code!~\"5..\"}[$budget_window]))\n/\nsum(rate(istio_requests_total{destination_workload_namespace=\"demo\", reporter=\"destination\"}[$budget_window]))\n)) / (1 - 0.9995))",
              "refId": "A",
              "format": "time_series"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
