        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency Percentiles (Fleet-Wide) \u2014 red line = 500ms SLO target",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 8
