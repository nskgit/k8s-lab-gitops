# ============================================================================
# Argo Application — demo-extras (echo + canary + httpbin + intranet).
#
# Closes a GitOps coverage gap: these were kubectl-applied in Phase 6.
# podinfo deliberately stays in its OWN Application (per-app granularity;
# it was the Phase 8 first adoption) — the includes here don't overlap.
#
# This also makes the canary GitOps-driven (Demo B): the echo HTTPRoute's
# 90/10 weights now change via git commit → Argo applies → Envoy shifts
# traffic. The mesh always does the splitting; git now drives the weights.
#
# Adopted 2026-07-15: first sync verified annotations-only, resources
# 'configured' (zero restarts); automated+selfHeal+prune since same day.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-extras
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:nskgit/k8s-lab-gitops.git
    targetRevision: main
    path: workloads/demo
    directory:
      include: '{echo.yaml,echo-v2-canary.yaml,httpbin.yaml,intranet.yaml,origin-healthz.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    # Fleet policy (flipped 2026-07-15 after verified adoption sync):
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      # Honour ignoreDifferences at SYNC time too (default: diff only). Argo
      # pre-patches the manifest it applies with the LIVE /spec/replicas, so
      # a sync never clobbers the HPA's count. Without it the client-side
      # 3-way merge against the stale last-applied `replicas:` would drop
      # the field and Kubernetes defaults it to 1 (the "one-time
      # degradation" the K8s HPA docs warn about).
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # Every Deployment here (echo, echo-v2, httpbin, intranet) is HPA-managed
    # and git deliberately omits spec.replicas (see the HPA comment in each
    # file). Without this an HPA scale-out shows as /spec/replicas drift and
    # selfHeal reverts it within seconds — HPA vs Argo tug-of-war. Also makes
    # a future re-added `replicas:` harmless instead of a regression.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
