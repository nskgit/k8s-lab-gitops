# ============================================================================
# hello-api — first service delivered by Pipeline 2 (k8s-lab-apps repo).
#
# STAGED FOR P9-lite STAGE 2 — no Application references this folder yet,
# so committing it deploys NOTHING. It goes live when:
#   1. CI pushes the first image to OCIR (stage 2),
#   2. the image: placeholder below is filled with the real OCIR path,
#   3. an Application for workloads/hello-api is added to applications/.
#
# Probes — all three, each with a DIFFERENT job:
#   startupProbe   gates the other two until the app has booted; protects
#                  slow starts from liveness kills (30 × 1s budget here —
#                  overkill for FastAPI, right habit for real apps)
#   readinessProbe "may traffic come?" — fail = pulled from endpoints,
#                  pod keeps running (used during rollouts + overload)
#   livenessProbe  "is the process wedged?" — fail = container RESTARTED.
#                  Points at dependency-free /healthz on purpose: a
#                  liveness probe that checks a database converts every
#                  DB outage into a cluster-wide restart storm.
#
# Metrics: /metrics on the app port; PodMonitor below makes Prometheus
# scrape every pod (kps convention: release: kps label, named port).
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-api
  namespace: demo
  labels:
    app: hello-api
spec:
  # replicas: deliberately absent — the HPA at the end of this file owns it
  selector:
    matchLabels:
      app: hello-api
  template:
    metadata:
      labels:
        app: hello-api
    spec:
      imagePullSecrets:
        - name: ocir-pull        # in-cluster only, never in git (like blog-db-credentials)
      containers:
        - name: hello-api
          # Tag = the exact commit that built it (green run #6, Pipeline 2).
          # Deploying a new version = changing THIS line via git.
          image: iad.ocir.io/idqz7bbbe34a/hello-api:4c9637ef1a4ef305e474ac97c88643b80df9a054
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PYTHONDONTWRITEBYTECODE   # read-only rootfs below
              value: "1"
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 128Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001              # matches the Dockerfile USER
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-api
  namespace: demo
  labels:
    app: hello-api
spec:
  selector:
    app: hello-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: hello-api
  namespace: demo
  labels:
    release: kps            # matches the stack's monitor-selection convention
spec:
  selector:
    matchLabels:
      app: hello-api
  podMetricsEndpoints:
    - port: http            # app serves /metrics on its main port
      path: /metrics
      interval: 30s
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-api
  namespace: demo
spec:
  parentRefs:
    - name: lab-gateway
      namespace: istio-system
      sectionName: https-sathesh
  hostnames:
    - hello-api.satheshkumarnapoleon.site
  rules:
    - backendRefs:
        - name: hello-api
          port: 80
---
# The Deployment above has NO spec.replicas on purpose: this HPA owns the
# count. With `replicas:` in git every scale-out is /spec/replicas drift that
# Argo selfHeal reverts within seconds (K8s + Argo CD docs: HPA-managed →
# drop replicas). The owning Application (hello-api) also ignores
# /spec/replicas. minReplicas == the value removed (2) → no scale-down on merge.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hello-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hello-api
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
