# ============================================================================
# Argo Application — podinfo (first adoption; raw manifests, zero-risk).
#
# podinfo is already running (kubectl apply'd in Phase 7). This Application
# points Argo at the SAME git manifest → identical render → Argo adopts the
# existing resources, adding only its tracking annotation on first sync.
# No Helm here — the simplest possible adoption to prove the pattern.
#
# History: adopted manually as the Phase 8 first adoption; auto-sync
# (prune + selfHeal) enabled fleet-wide in P8-29 — this app IS automated.
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podinfo
  namespace: argocd
  # Keep the Application object even if the app-of-apps is deleted, until
  # we intentionally remove it.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:nskgit/k8s-lab-gitops.git
    targetRevision: main
    path: workloads/demo
    directory:
      include: 'podinfo.yaml'   # adopt ONLY podinfo, not echo/httpbin/etc.
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    # Auto-sync (P8-29): git change deploys itself; live drift reverts in
    # seconds (selfHeal); resource removed from git is deleted (prune).
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false     # demo ns already exists
      # Honour ignoreDifferences at SYNC time too (default: diff only). Argo
      # pre-patches the manifest it applies with the LIVE /spec/replicas, so
      # a sync never clobbers the HPA's count. Without it the client-side
      # 3-way merge against the stale last-applied `replicas:` would drop
      # the field and Kubernetes defaults it to 1 (the "one-time
      # degradation" the K8s HPA docs warn about).
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # podinfo's Deployment is HPA-managed and git deliberately omits
    # spec.replicas (see the HPA comment in workloads/demo/podinfo.yaml).
    # Without this an HPA scale-out shows as /spec/replicas drift and
    # selfHeal reverts it within seconds — HPA vs Argo tug-of-war. Also makes
    # a future re-added `replicas:` harmless instead of a regression.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
