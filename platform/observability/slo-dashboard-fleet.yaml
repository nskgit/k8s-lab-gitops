          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${DS_PROMETHEUS}"
              },
              "expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"demo\", reporter=\"destination\", response_code=~\"5..\"}[$sli_window]))",
              "refId": "A",
